<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string') {
              if (arg.indexOf('[vite]') !== -1 || arg.indexOf('@vite/client') !== -1 || arg.toLowerCase().indexOf('websocket') !== -1 || arg.indexOf('ethereum') !== -1) {
                return;
              }
            } else if (arg && typeof arg === 'object') {
              var msg = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.reason || '');
              if (msg.indexOf('[vite]') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.toLowerCase().indexOf('websocket') !== -1 || msg.indexOf('ethereum') !== -1) {
                return;
              }
            }
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + (event.filename || '');
          if (event.error && event.error.message) msg += ' ' + event.error.message;
          if (msg.indexOf('[vite]') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.toLowerCase().indexOf('websocket') !== -1 || msg.indexOf('ethereum') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var str = '';
          if (typeof reason === 'string') {
            str = reason;
          } else if (reason && typeof reason === 'object') {
            str = (reason.message || '') + ' ' + (reason.stack || '');
          }
          if (str.indexOf('[vite]') !== -1 || str.indexOf('@vite/client') !== -1 || str.toLowerCase().indexOf('websocket') !== -1 || str.indexOf('ethereum') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        
        // Clean up dev service workers that might be causing background [vite] errors
        if (window.location.hostname === 'localhost' || window.location.hostname.indexOf('dev-') !== -1) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var j = 0; j < registrations.length; j++) {
                registrations[j].unregister();
              }
            });
          }
          
          // Mock WebSocket to prevent Vite client from throwing connection errors in sandbox
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (url && url.indexOf('vite-hmr') !== -1)) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 0,
                CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1; window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
